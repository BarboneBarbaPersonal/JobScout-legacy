# JobScout: manual "what would match right now?" run.
# Builds jobwatch and runs it with -dry-run: prints every job that passes
# the filters in jobscout.yaml. Sends no email and saves no state, so it is
# safe to run any time you tweak the keywords.
#
# Run it from: Actions tab -> "dry-run" -> Run workflow.

name: dry-run

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 120 # a run with no saved state opens every Workday job; Cisco alone takes ~8 min
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build and test
        run: |
          go test ./...
          go vet ./...
          go build -o jobwatch ./cmd/jobwatch

      # Revolut's bot protection blocks Go's TLS fingerprint but not curl:
      # download the page here; the revolut source reads this file.
      - name: Download Revolut careers page
        run: |
          curl -sL --max-time 60 -o revolut-careers.html             -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0 Safari/537.36"             -H "Accept: text/html,application/xhtml+xml" -H "Accept-Language: en-GB,en;q=0.9"             https://www.revolut.com/careers/ || true
          if ! grep -q __NEXT_DATA__ revolut-careers.html; then
            echo "revolut page without data ($(wc -c < revolut-careers.html) bytes): $(grep -o '<title>[^<]*' revolut-careers.html | head -1)"
          fi

      - name: Show current matches
        run: ./jobwatch -config jobscout.yaml -dry-run
