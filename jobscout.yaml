# JobScout configuration (fork of jobwatch).
# Watches the CS / TAM / CSE target companies from the
# "CS_TAM_Target_Companies" Google Sheet and publishes matching roles on a
# job board web page (GitHub Pages). No email.
# No AI / no tokens: matching is plain keyword rules on title + location.
#
# To add a company: add one line under `companies:` (see README table
# "boards.greenhouse.io/acme -> source: greenhouse ..."), or re-run
#   python jobscout/discover_ats.py
# and copy the new lines from jobscout/companies.found.yaml.

poll:
  timeout_seconds: 60 # big Greenhouse boards (full descriptions) can take >30s
  concurrency: 6 # companies fetched in parallel

# Speed-up: checked BEFORE a job's detail page is opened (Workday boards only
# list "2 Locations", so every job would otherwise be opened one by one).
# Keep it IDENTICAL to rule 1 below -- it may only skip jobs rule 1 rejects.
prefilter:
  name: keywords
  params:
    field: title
    include: >-
      customer success, technical account manager, tam, csm, cse,
      customer success engineer, customer success architect, technical customer success, technical success, csam,
      forward deployed engineer, forward deployed, fde,
      service delivery manager, service delivery, sdm,
      customer engineer, implementation manager, implementation consultant,
      implementation specialist, onboarding manager, onboarding specialist,
      engagement manager, value engineer, support engineer,
      account manager, client success, client partner, partner success, renewals manager,
      customer operations, customer experience, escalation manager, customer support manager
    exclude: >-
      intern, internship, working student, vp, vice president, director, chief,
      solutions engineer, solution engineer, solutions architect, solution architect,
      french, german, dutch, flemish, portuguese, polish, czech, slovak, hungarian, romanian,
      bulgarian, greek, turkish, russian, ukrainian, swedish, danish, norwegian, finnish,
      arabic, hebrew, japanese, korean, mandarin, chinese, cantonese, hindi, vietnamese, thai,
      francophone, dach, benelux, nordic, nordics, france, germany, netherlands, belgium,
      poland, portugal, brazil, japan, korea, china, sweden, denmark, norway, finland

# A job goes on the board only if ALL rules pass.
matcher:
  name: all
  of:
    # 0. Posted within the last 30 days. Boards that give no posting date
    #    still pass (the page drops those 30 days after they were found).
    - name: recency
      params:
        max_days: 30
        match_when_unknown: true
    # 1. Title must be a Customer Success / TAM / CSE / FDE / SDM-type role.
    #    Terms are case-insensitive whole words ("tam" does not match "team").
    #    Solutions Engineer / Architect roles are deliberately NOT included.
    #    Language focus: only Italian / English / Spanish speaking roles, so
    #    titles naming another language or a non-IT/EN/ES market are dropped.
    - name: keywords
      params:
        field: title
        include: >-
          customer success, technical account manager, tam, csm, cse,
          customer success engineer, customer success architect, technical customer success, technical success, csam,
          forward deployed engineer, forward deployed, fde,
          service delivery manager, service delivery, sdm,
          customer engineer, implementation manager, implementation consultant,
          implementation specialist, onboarding manager, onboarding specialist,
          engagement manager, value engineer, support engineer,
          account manager, client success, client partner, partner success, renewals manager,
          customer operations, customer experience, escalation manager, customer support manager
        exclude: >-
          intern, internship, working student, vp, vice president, director, chief,
          solutions engineer, solution engineer, solutions architect, solution architect,
          french, german, dutch, flemish, portuguese, polish, czech, slovak, hungarian, romanian,
          bulgarian, greek, turkish, russian, ukrainian, swedish, danish, norwegian, finnish,
          arabic, hebrew, japanese, korean, mandarin, chinese, cantonese, hindi, vietnamese, thai,
          francophone, dach, benelux, nordic, nordics, france, germany, netherlands, belgium,
          poland, portugal, brazil, japan, korea, china, sweden, denmark, norway, finland
    # 2. Location: Barcelona, remote, or Spain (email ranks them in that
    #    order -- see `rank` on the email notifier). Either:
    - name: any
      of:
        # a) the job is in Barcelona / Spain (even if it also lists other cities), or
        - name: keywords
          params:
            field: location
            include: barcelona, catalunya, cataluña, catalonia, spain, españa, espana, madrid
        # b) it is remote and does not name some other country or region,
        #    in its location or title, so "Remote - Germany", "Remote U.S." or
        #    "Value Engineer | UK | Remote" are dropped.
        - name: all
          of:
            - name: keywords
              params:
                field: location
                include: remote, anywhere, worldwide, distributed
            - name: keywords
              params:
                field: location
                exclude: >-
                  united states, usa, us, u.s, canada, north america, americas, amer, latam,
                  mexico, brazil, colombia, argentina, chile, peru, costa rica, ontario, toronto,
                  united arab emirates, emirates,
                  apac, asia, india, japan, singapore, australia, new zealand, philippines,
                  korea, china, hong kong, taiwan, israel, uae, dubai, saudi arabia, turkey,
                  south africa, nigeria, kenya, egypt,
                  united kingdom, uk, gbr, england, london, ireland, germany, deutschland,
                  france, poland, bulgaria, romania, denmark, finland, sweden, norway,
                  netherlands, belgium, portugal, italy, austria, switzerland, czech republic,
                  czechia, hungary, greece, estonia, lithuania, latvia, croatia, serbia,
                  ukraine, slovakia, slovenia, luxembourg,
                  california, new york, texas, washington, massachusetts, colorado, florida,
                  charlotte, san diego, austin, orlando, milwaukee, chicago, denver, philadelphia,
                  los angeles, nyc, seattle, nashville, houston, cincinnati, minnesota, detroit,
                  pittsburgh, raleigh, bentonville, bentoville, boston, atlanta, dallas, san francisco,
                  bay area, miami, phoenix, portland, canberra, southwest, midwest, northeast,
                  ar, mi, pa, nc, la, tx, oh, ny, wa, fl, ga, il, nj, va, mn, az,
                  addison, vienna, berlin, munich, hamburg, frankfurt, paris, amsterdam, dublin,
                  lisbon, porto, warsaw, krakow, prague, stockholm, copenhagen, oslo, helsinki,
                  zurich, geneva, milan, rome, brussels, budapest, bucharest, sofia, athens,
                  tel aviv, sydney, melbourne, tokyo, bangalore, bengaluru, hyderabad, pune,
                  vancouver, montreal, mexico city, sao paulo, são paulo, buenos aires,
                  armenia, yerevan, georgia, tbilisi, kazakhstan, almaty, uzbekistan, kyrgyzstan,
                  azerbaijan, moldova, bosnia, montenegro, north macedonia, albania, cyprus,
                  uganda, kampala, ghana, morocco, tunisia, pakistan, bangladesh, sri lanka
            - name: keywords
              params:
                field: title
                # same list as above (jobwatch does not support YAML anchors)
                exclude: >-
                  united states, usa, us, u.s, canada, north america, americas, amer, latam,
                  mexico, brazil, colombia, argentina, chile, peru, costa rica, ontario, toronto,
