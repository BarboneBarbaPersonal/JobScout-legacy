<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Reload every 30 minutes so a new scan shows up without touching anything -->
<meta http-equiv="refresh" content="1800">
<meta name="robots" content="noindex, nofollow">
<title>JobScout Board</title>
<style>
  :root {
    --bg: #f6f4ef; --panel: #ece8df; --card: #ffffff; --text: #1d1b18; --muted: #6b665d;
    --line: #ddd7cb; --accent: #b5341a; --bcn: #b5341a; --remote: #2f6f9f; --spain: #7a5c3a;
    --fit0: #e9e5dc; --fit1: #f3dfb3; --fit2: #cfe8c6; --ok: #2e7d32; --warn: #b26a00;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161513; --panel: #1f1d1a; --card: #282622; --text: #eeeae2; --muted: #a39d92;
      --line: #3a3732; --accent: #e0714f; --bcn: #e0714f; --remote: #6aaee0; --spain: #c9a27a;
      --fit0: #34312c; --fit1: #574a2c; --fit2: #2f4a2b; --ok: #7bc47f; --warn: #e0a64f;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .wrap { max-width: 1300px; margin: 0 auto; padding: 0 16px; }
  header { padding: 20px 0 8px; display: flex; flex-wrap: wrap; gap: 4px 16px; align-items: baseline; }
  h1 { margin: 0; font-size: 22px; }
  h1 span { color: var(--accent); }
  .sub { color: var(--muted); font-size: 13px; }

  /* Stats bar */
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin: 8px 0 12px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; }
  .stat .label { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .stat .value { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stat .detail { font-size: 12px; color: var(--muted); }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; vertical-align: middle; }

  /* Filters */
  .filters { display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; margin-bottom: 12px; font-size: 13px; }
  .group { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
  .group > span { color: var(--muted); margin-right: 4px; }
  .chip { font: inherit; font-size: 13px; color: var(--text); background: var(--card); border: 1px solid var(--line);
          border-radius: 999px; padding: 3px 12px; cursor: pointer; }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .toggle { margin-left: auto; color: var(--muted); }

  main { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; padding-bottom: 32px; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; } .toggle { margin-left: 0; } }
  .column { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
  h2 { margin: 0; font-size: 16px; display: flex; gap: 8px; align-items: center; }
  .count { font-size: 12px; background: var(--card); border: 1px solid var(--line);
           border-radius: 999px; padding: 1px 8px; color: var(--muted); }
  .note { margin: 2px 0 10px; font-size: 12px; color: var(--muted); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; }
  .top, .bottom { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .company { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; }
  .fit { font-size: 11px; border-radius: 4px; padding: 1px 6px; white-space: nowrap; }
  .fit0 { background: var(--fit0); } .fit1 { background: var(--fit1); } .fit2 { background: var(--fit2); }
  .title { display: block; margin: 4px 0; color: var(--text); font-weight: 600; text-decoration: none; overflow-wrap: anywhere; }
  .title:hover { color: var(--accent); text-decoration: underline; }
  .meta { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
  .place { font-size: 11px; font-weight: 700; margin-right: 4px; }
  .p-Barcelona { color: var(--bcn); } .p-Remote { color: var(--remote); } .p-Spain { color: var(--spain); }
  .tag { font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; }
  .bottom { margin-top: 6px; font-size: 12px; color: var(--muted); }
  .hide { font: inherit; font-size: 12px; color: var(--muted); background: none;
          border: 1px solid var(--line); border-radius: 4px; padding: 1px 8px; cursor: pointer; }
  .hide:hover { color: var(--text); }
  .like { text-decoration: none; margin-left: auto; color: var(--accent); border-color: var(--accent); }
  .like:disabled { opacity: .7; cursor: default; }

  /* CV insights (private) */
  .private-toggle { margin-left: auto; }
  .private-box { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; font-size: 13px; }
  .private-box p { margin: 0 0 8px; }
  .private-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .private-row input { flex: 1; min-width: 180px; font: inherit; padding: 4px 8px; border: 1px solid var(--line);
                       border-radius: 6px; background: var(--bg); color: var(--text); }
  .private-status { color: var(--muted); margin-top: 6px !important; }
  .draft { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .draft .match { font-weight: 700; color: var(--text); }
  .proposals { border-top: 1px dashed var(--line); margin-top: 8px; padding-top: 6px; font-size: 13px; }
  .proposals h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); margin: 8px 0 4px; }
  .proposals p { margin: 0 0 6px; overflow-wrap: anywhere; }
  .proposals .quote { border-left: 3px solid var(--accent); padding-left: 8px; }
  .proposals .lead::before { content: "▲ "; color: var(--ok); }
  .proposals .shorten::before { content: "▼ "; color: var(--warn); }
  .proposals .warn { color: var(--warn); font-size: 12px; }
  .kw { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; }
  .kw-missing { font-size: 12px; border: 1px solid var(--warn); color: var(--warn); border-radius: 999px; padding: 0 8px; }
  .card.hidden { opacity: .45; }
  .empty { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Job<span>Scout</span></h1>
    <span class="sub" id="updated"></span>
    <button type="button" class="chip private-toggle" id="private-toggle">CV insights: off</button>
  </header>
  <!-- Private access: a GitHub key limited to the private jobscout-cv repo, kept in this browser only -->
  <section class="private-box" id="private-box" hidden>
    <p>Paste your GitHub access key for the private <b>jobscout-cv</b> repo. It is stored only in this
       browser and used to load your CV insights and send Likes. Nothing private is in this public page.</p>
    <div class="private-row">
      <input type="password" id="private-key" placeholder="github_pat_..." autocomplete="off">
      <button type="button" class="chip" id="private-save">Connect</button>
      <button type="button" class="chip" id="private-forget">Disconnect</button>
    </div>
    <p class="private-status" id="private-status"></p>
  </section>
  <section class="stats" id="stats"></section>
  <section class="filters">
    <div class="group" id="place-filter"><span>Location</span></div>
    <div class="group" id="role-filter"><span>Role</span></div>
    <label class="toggle"><input type="checkbox" id="show-hidden"> show hidden</label>
  </section>
  <main id="board"></main>
</div>

egraded", "scans_24h": 7, "scanned": 21199, "boards": 152, "boards_ok": 151, "new_postings_last": 1, "new_postings_24h": 2043, "new_matches_24h": 17, "total": 47, "barcelona": 20, "remote": 7, "spain": 20, "core": 10, "account": 13}, "new_for_hours": 48, "max_age_days": 30}</script>
<script>
  // All page data (jobs + stats) is embedded above by build_page.py.
  var DATA = JSON.parse(document.getElementById("data").textContent);
  var stats = DATA.stats;
  var filters = { place: "All", role: "All" };
  var showHidden = false;

  // ---- small helpers ----
  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }
  function ago(iso) {
    if (!iso) return "never";
    var minutes = Math.round((Date.now() - new Date(iso)) / 60000);
    if (minutes < 60) return minutes + " min ago";
    if (minutes < 48 * 60) return Math.round(minutes / 60) + " h ago";
    return Math.round(minutes / 1440) + " days ago";
  }
  function dayAge(iso) {
    var days = Math.floor((Date.now() - new Date(iso)) / 86400000);
    return days <= 0 ? "today" : days + "d ago";
  }
  function num(value) { return value === null || value === undefined ? "-" : value.toLocaleString("en-US"); }

  // ---- "Hide" remembers dismissed jobs in this browser only (per device) ----
  var KEY = "jobscout-hidden";
  var hidden = [];
  try { hidden = JSON.parse(localStorage.getItem(KEY) || "[]"); } catch (e) { hidden = []; }
  function saveHidden() {
    try { localStorage.setItem(KEY, JSON.stringify(hidden)); } catch (e) {}
    saveHiddenRemote(); // with CV insights connected, also keep it in the private repo (all devices)
  }

  // ---- stats bar ----
  function renderStats() {
    document.getElementById("updated").textContent =
      "Page built " + ago(stats.updated) + " · scans twice an hour · jobs older than " + DATA.max_age_days + " days are removed";
    var healthy = stats.boards && stats.boards_ok === stats.boards;
    var items = [
      ["Last scan", ago(stats.last_scan), (stats.scans_24h || 0) + (stats.scans_24h === 1 ? " scan" : " scans") + " in last 24 h", healthy ? "var(--ok)" : "var(--warn)"],
      ["Jobs scanned", num(stats.scanned), num(stats.boards_ok) + " / " + num(stats.boards) + " company boards OK"],
      ["New postings", num(stats.new_postings_24h), num(stats.new_postings_last) + " in last scan · all titles, 24 h"],
      ["Matches on board", num(stats.total), num(stats.new_matches_24h) + " new in last 24 h"],
      ["Barcelona", num(stats.barcelona), "Remote " + num(stats.remote) + " · Spain " + num(stats.spain)],
      ["Core roles", num(stats.core), "Account Mgr " + num(stats.account) + " · Adjacent " + num(stats.total - stats.core - (stats.account || 0))]
    ];
    var box = document.getElementById("stats");
    items.forEach(function (item) {
      var stat = el("div", "stat");
      var label = el("div", "label");
      if (item[3]) { var dot = el("span", "dot"); dot.style.background = item[3]; label.appendChild(dot); }
      label.appendChild(document.createTextNode(item[0]));
      stat.appendChild(label);
      stat.appendChild(el("div", "value", item[1]));
      stat.appendChild(el("div", "detail", item[2]));
      box.appendChild(stat);
    });
  }

  // ---- filter chips ----
  function renderChips(boxId, key, options) {
    var box = document.getElementById(boxId);
    options.forEach(function (option) {
      var chip = el("button", "chip", option[1]);
      chip.type = "button";
      chip.dataset.value = option[0];
      chip.setAttribute("aria-pressed", String(filters[key] === option[0]));
      chip.addEventListener("click", function () {
        filters[key] = option[0];
        box.querySelectorAll(".chip").forEach(function (c) {
          c.setAttribute("aria-pressed", String(c.dataset.value === filters[key]));
        });
        renderBoard();
      });
      box.appendChild(chip);
    });
  }

  // ---- job cards and columns ----
  function card(job) {
    var isHidden = hidden.indexOf(job.id) !== -1;
    var node = el("article", "card" + (isHidden ? " hidden" : ""));
    var top = el("div", "top");
    top.appendChild(el("span", "company", job.company));
    var fit = el("span", "fit fit" + Math.floor(Math.min(job.fit, 8) / 3), "fit " + job.fit);
    fit.title = "Fit score " + job.fit + "/8 (location x2 + role)";
    top.appendChild(fit);
    node.appendChild(top);

    var link = el("a", "title", job.title);
    link.href = job.url; link.target = "_blank"; link.rel = "noopener";
    node.appendChild(link);

    var meta = el("div", "meta");
    meta.appendChild(el("span", "place p-" + job.place, job.place));
    meta.appendChild(document.createTextNode(job.location + " "));
    meta.appendChild(el("span", "tag", job.role));
    node.appendChild(meta);

    // Private CV draft (match % + missing keywords), only when the access key is set.
    var draft = draftLine(job);
    if (draft) node.appendChild(draft);

    var bottom = el("div", "bottom");
    var when = (job.posted_at ? "posted " + dayAge(job.posted_at) + " · " : "") + "found " + dayAge(job.found_at);
    bottom.appendChild(el("span", "", when));
    bottom.appendChild(likeButton(job));
    var button = el("button", "hide", isHidden ? "Unhide" : "Hide");
    button.type = "button";
    button.addEventListener("click", function () {
      var index = hidden.indexOf(job.id);
      if (index === -1) { hidden.push(job.id); } else { hidden.splice(index, 1); }
      saveHidden();
      if (!PRIV.cv) {
        // Not connected: the hide lives only in this browser and can be wiped. Say so.
        togglePrivateBox(true);
        document.getElementById("private-status").textContent =
          "Hidden on this browser only. Connect CV insights to keep hidden jobs on all devices.";
      }
      renderBoard();
    });
    bottom.appendChild(button);
    node.appendChild(bottom);
    if (PRIV.open[job.id]) node.appendChild(proposalsPanel(job));
    return node;
  }

  function column(title, note, jobs) {
    var section = el("section", "column");
    var heading = el("h2", "", title + " ");
    heading.appendChild(el("span", "count", String(jobs.length)));
    section.appendChild(heading);
    section.appendChild(el("p", "note", note));
    if (!jobs.length) section.appendChild(el("p", "empty", "Nothing here."));
    jobs.forEach(function (job) { section.appendChild(card(job)); });
    return section;
  }

  function renderBoard() {
    var newCutoff = Date.now() - DATA.new_for_hours * 3600000;
    // Apply the filters (and hide dismissed jobs unless "show hidden" is ticked).
    var jobs = DATA.jobs.filter(function (job) {
      if (filters.place !== "All" && job.place !== filters.place) return false;
      if (filters.role !== "All" && job.role !== filters.role) return false;
      if (!showHidden && hidden.indexOf(job.id) !== -1) return false;
      return true;
    });
    // Best fit first; ties go to the most recently found.
    jobs.sort(function (a, b) { return b.fit - a.fit || (b.found_at > a.found_at ? 1 : -1); });

    var fresh = jobs.filter(function (job) { return new Date(job.found_at) >= newCutoff; });
    var best = jobs.slice(0, 10);
    var used = {};
    fresh.concat(best).forEach(function (job) { used[job.id] = true; });
    var older = jobs.filter(function (job) { return !used[job.id]; });

    var board = document.getElementById("board");
    board.textContent = "";
    board.appendChild(column("New", "First seen in the last " + DATA.new_for_hours + " hours", fresh));
    board.appendChild(column("Best fit", "Top 10: Barcelona > remote > Spain, core roles first", best));
    board.appendChild(column("Older", "Everything else still open", older));
  }

  // =====================================================================
  // CV insights (private). Everything below only runs with the access key
  // the user saved in this browser; it talks to the private jobscout-cv
  // repo through the GitHub API. The public page contains no CV data.
  // =====================================================================
  var CV_REPO = "BarboneBarbaPersonal/jobscout-cv";
  var TOKEN_KEY = "jobscout-cv-token";
  var PRIV = { token: "", cv: "", vocab: [], descriptions: {}, issues: {}, results: {}, open: {}, polling: {} };
  try { PRIV.token = localStorage.getItem(TOKEN_KEY) || ""; } catch (e) {}

  // Call the GitHub API with the saved key. raw=true returns a file's plain text.
  function api(path, options, raw) {
    options = options || {};
    options.headers = {
      "Authorization": "Bearer " + PRIV.token,
      "Accept": raw ? "application/vnd.github.raw+json" : "application/vnd.github+json"
    };
    return fetch("https://api.github.com/repos/" + CV_REPO + path, options).then(function (response) {
      if (response.status === 404) return null;
      if (!response.ok) throw new Error("GitHub API " + response.status);
      return raw ? response.text() : response.json();
    });
  }

  // Same file names as scripts/analyze.py safe_name().
  function safeName(id) { return id.replace(/[^A-Za-z0-9._-]/g, "_"); }

  function termRegex(term) {
    return new RegExp("(?<![\\w-])" + term.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "(?![\\w-])", "gi");
  }

  // Draft for one job: share of the job's important terms that the CV mentions.
  function draft(job) {
    var text = PRIV.descriptions[job.id];
    if (!PRIV.cv || !text) return null;
    var found = [];
    PRIV.vocab.forEach(function (term) {
      var hits = (text.match(termRegex(term)) || []).length;
      if (hits) found.push({ term: term, count: hits, inCv: termRegex(term).test(PRIV.cv) });
    });
    if (!found.length) return null;
    found.sort(function (a, b) { return b.count - a.count; });
    var present = found.filter(function (f) { return f.inCv; }).length;
    return { match: Math.round(100 * present / found.length),
             missing: found.filter(function (f) { return !f.inCv; }).slice(0, 4) };
  }

  function draftLine(job) {
    var d = draft(job);
    if (!d) return null;
    var line = el("div", "draft");
    line.appendChild(el("span", "match", d.match + "% match"));
    if (d.missing.length) {
      line.appendChild(document.createTextNode(" · missing: " +
        d.missing.map(function (m) { return m.term; }).join(", ")));
    }
    return line;
  }

  // Like / Analyzing / Proposals button, depending on the job's state.
  function likeButton(job) {
    var button = el("button", "hide like");
    button.type = "button";
    var issue = PRIV.issues[job.id];
    var result = PRIV.results[safeName(job.id)];
    if (!PRIV.token) {
      button.textContent = "Like";
      button.title = "Connect CV insights (top right) to use Like";
      button.addEventListener("click", function () { togglePrivateBox(true); });
    } else if (result) {
      button.textContent = PRIV.open[job.id] ? "Close" : "Proposals";
      button.addEventListener("click", function () {
        PRIV.open[job.id] = !PRIV.open[job.id];
        loadResult(job).then(renderBoard);
      });
    } else if (issue) {
      button.textContent = "Analyzing...";
      button.disabled = true;
      button.title = "Takes about 10 minutes; this card updates by itself";
      pollResult(job);
    } else {
      button.textContent = "Like";
      button.addEventListener("click", function () { likeJob(job, button); });
    }
    return button;
  }

  // Like = open an issue in the private repo; its workflow writes results/<job>.json.
  function likeJob(job, button) {
    button.disabled = true;
    button.textContent = "Sending...";
    var body = "JobScout id: " + job.id + "\nLink: " + job.url + "\nCompany: " + job.company +
               "\nTitle: " + job.title + "\nLocation: " + job.location;
    api("/issues", { method: "POST", body: JSON.stringify({ title: job.company + " - " + job.title, body: body }) })
      .then(function (issue) { PRIV.issues[job.id] = issue.number; renderBoard(); })
      .catch(function (error) { button.disabled = false; button.textContent = "Like"; alert("Like failed: " + error.message); });
  }

  // While a job is being analyzed, check for its result every 30 seconds.
  function pollResult(job) {
    if (PRIV.polling[job.id]) return;
    PRIV.polling[job.id] = setInterval(function () {
      api("/contents/results/" + safeName(job.id) + ".json", {}, true).then(function (text) {
        if (!text) return;
        clearInterval(PRIV.polling[job.id]);
        PRIV.results[safeName(job.id)] = JSON.parse(text);
        PRIV.open[job.id] = true;
        renderBoard();
      }).catch(function () {});
    }, 30000);
  }

  function loadResult(job) {
    var name = safeName(job.id);
    if (PRIV.results[name] && PRIV.results[name] !== true) return Promise.resolve();
    return api("/contents/results/" + name + ".json", {}, true).then(function (text) {
      if (text) PRIV.results[name] = JSON.parse(text);
    });
  }

  // The proposals panel under a liked job's card.
  function proposalsPanel(job) {
    var r = PRIV.results[safeName(job.id)];
    var panel = el("div", "proposals");
    if (!r || r === true) { panel.appendChild(el("p", "empty", "Loading...")); return panel; }
    if (r.status !== "done") { panel.appendChild(el("p", "empty", r.error || "Analysis failed.")); return panel; }

    function section(title) { var h = el("h3", "", title); panel.appendChild(h); }
    function para(text, className) { panel.appendChild(el("p", className || "", text)); }
    function warnings(list) { (list || []).forEach(function (w) { para("Check: " + w, "warn"); }); }

    section("1. Keywords the job needs (" + r.match + "% match)");
    var chips = el("div", "kw");
    (r.missing || []).forEach(function (m) { chips.appendChild(el("span", "kw-missing", m.term + " ×" + m.count)); });
    if (!(r.missing || []).length) para("None missing.");
    panel.appendChild(chips);

    section("2. Intro rewrite (Gemma draft)");
    if (r.intro) { para(r.intro, "quote"); warnings(r.intro_warnings); }
    else para(r.gemma_error || "No draft.", "empty");

    section("3. Past roles");
    (r.lead || []).forEach(function (b) { para("Lead with (" + b.role + "): " + b.text, "lead"); });
    (r.shorten || []).forEach(function (b) { para("Shorten (" + b.role + "): " + b.text, "shorten"); });
    (r.flags || []).forEach(function (f) { para("Gemma: " + f); });
    warnings(r.flag_warnings);

    if (r.claude_edits && r.claude_edits.length) {
      section("Claude edits");
      r.claude_edits.forEach(function (e) {
        para(e.section + ": \"" + e.current + "\" → \"" + e.new + "\" (" + e.why + ")");
      });
    } else {
      para("Deeper edits: ask Claude \"CV edits for jobscout-cv issue #" + (r.issue || "?") + "\".", "empty");
    }
    return panel;
  }

  // ---- Hidden jobs, shared across devices ----
  // Stored as the body of one closed issue in the private repo ("JobScout hidden jobs"),
  // one job id per line. Editing an issue body sends no notification emails.
  var HIDDEN_TITLE = "JobScout hidden jobs";
  var hiddenTimer = null;
  function hiddenBody() { return "Hidden jobs (managed by the JobScout dashboard):\n" + hidden.join("\n"); }
  function readHiddenBody(body) {
    return (body || "").split("\n").slice(1).map(function (line) { return line.trim(); })
      .filter(function (line) { return line; });
  }
  function saveHiddenRemote() {
    if (!PRIV.token || !PRIV.cv) return;
    clearTimeout(hiddenTimer);
    // Wait a second so several quick clicks become one save.
    hiddenTimer = setTimeout(function () {
      var request = PRIV.hiddenIssue
        ? api("/issues/" + PRIV.hiddenIssue, { method: "PATCH", body: JSON.stringify({ body: hiddenBody() }) })
        : api("/issues", { method: "POST", body: JSON.stringify({ title: HIDDEN_TITLE, body: hiddenBody() }) })
            .then(function (issue) {
              PRIV.hiddenIssue = issue.number;
              return api("/issues/" + issue.number, { method: "PATCH", body: JSON.stringify({ state: "closed" }) });
            });
      request.catch(function (error) {
        document.getElementById("private-status").textContent = "Could not save hidden jobs (" + error.message + ").";
      });
    }, 1000);
  }

  // Load everything private: CV, term list, job descriptions, liked jobs and results.
  function connect() {
    var status = document.getElementById("private-status");
    if (!PRIV.token) { updatePrivateToggle(); return; }
    status.textContent = "Connecting...";
    Promise.all([
      api("/contents/cv/master.md", {}, true),
      api("/contents/data/vocabulary.json", {}, true),
      api("/issues?state=all&per_page=100"),
      api("/contents/results"),
      fetch("matches.json").then(function (r) { return r.json(); })
    ]).then(function (all) {
      PRIV.cv = all[0] || "";
      PRIV.vocab = JSON.parse(all[1] || "[]");
      var remoteHidden = null;
      (all[2] || []).forEach(function (issue) {
        if (issue.title === HIDDEN_TITLE) {
          PRIV.hiddenIssue = issue.number;
          remoteHidden = readHiddenBody(issue.body);
          return;
        }
        var match = /JobScout id:\s*(\S+)/.exec(issue.body || "");
        if (match && !PRIV.issues[match[1]]) PRIV.issues[match[1]] = issue.number;
      });
      // Merge this device's hidden jobs with the shared list, then save the union.
      var before = (remoteHidden || []).length;
      hidden = (remoteHidden || []).concat(hidden.filter(function (id) { return (remoteHidden || []).indexOf(id) === -1; }));
      try { localStorage.setItem(KEY, JSON.stringify(hidden)); } catch (e) {}
      (all[3] || []).forEach(function (file) {
        if (/\.json$/.test(file.name)) PRIV.results[file.name.replace(/\.json$/, "")] = true;
      });
      all[4].forEach(function (job) { if (job.description) PRIV.descriptions[job.id] = job.description; });
      status.textContent = "Connected: CV loaded, " + Object.keys(PRIV.issues).length + " liked jobs, " +
        hidden.length + " hidden jobs (shared across devices).";
      updatePrivateToggle();
      if (hidden.length !== before) saveHiddenRemote(); // this device had hides the shared list lacked
      renderBoard();
    }).catch(function (error) {
      status.textContent = "Could not connect (" + error.message + "). Check the key's repo access and permissions.";
    });
  }

  function updatePrivateToggle() {
    document.getElementById("private-toggle").textContent = "CV insights: " + (PRIV.cv ? "on" : "off");
  }
  function togglePrivateBox(show) {
    var box = document.getElementById("private-box");
    box.hidden = show === undefined ? !box.hidden : !show;
  }
  document.getElementById("private-toggle").addEventListener("click", function () { togglePrivateBox(); });
  document.getElementById("private-save").addEventListener("click", function () {
    PRIV.token = document.getElementById("private-key").value.trim();
    try { localStorage.setItem(TOKEN_KEY, PRIV.token); } catch (e) {}
    document.getElementById("private-key").value = "";
    connect();
  });
  document.getElementById("private-forget").addEventListener("click", function () {
    try { localStorage.removeItem(TOKEN_KEY); } catch (e) {}
    location.reload();
  });

  renderStats();
  renderChips("place-filter", "place", [["All", "All"], ["Barcelona", "Barcelona"], ["Remote", "Remote"], ["Spain", "Spain"]]);
  renderChips("role-filter", "role", [["All", "All"], ["core", "Core"], ["account", "Account Manager"], ["adjacent", "Adjacent"]]);
  document.getElementById("show-hidden").addEventListener("change", function (e) {
    showHidden = e.target.checked;
    renderBoard();
  });
  renderBoard();
  connect();
</script>
</body>
</html>
